name: Fix PHP Code Style

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Run Pint
        uses: aglipanci/laravel-pint-action@latest

      - name: Commit the fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Fix code style with Pint'
